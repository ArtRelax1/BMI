<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณ BMI สไตล์มินิมอล</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Noto Sans Thai Font for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for hiding number input arrows for cleaner look */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <main class="w-full max-w-md">
        <!-- Main Card -->
        <div class="bg-white rounded-[2rem] shadow-soft p-8 sm:p-10 transition-all duration-300">
            
            <header class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-700 tracking-tight">เครื่องคิดเลข BMI</h1>
                <p class="text-slate-400 mt-2 text-sm">ตรวจสอบดัชนีมวลกายของคุณ</p>
            </header>

            <div class="space-y-6">
                
                <!-- Name Input -->
                <div class="space-y-2">
                    <label for="name" class="block text-sm font-medium text-slate-500 ml-1">ชื่อ-สกุล</label>
                    <input type="text" id="name" placeholder="เช่น ภูมินทร์ นาคมะเริง" 
                        class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-700 text-lg focus:outline-none focus:border-brand-500 focus:bg-white transition-colors placeholder-slate-300">
                </div>

                <!-- Gender Input -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-500 ml-1">เพศ</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="gender" value="male" class="peer sr-only" checked>
                            <div class="text-center px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-600 font-medium peer-checked:border-brand-500 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition-all">
                                ชาย
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="gender" value="female" class="peer sr-only">
                            <div class="text-center px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-600 font-medium peer-checked:border-brand-500 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition-all">
                                หญิง
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Height Input -->
                <div class="space-y-2">
                    <label for="height" class="block text-sm font-medium text-slate-500 ml-1">ส่วนสูง (เซนติเมตร)</label>
                    <div class="relative">
                        <input type="number" id="height" placeholder="เช่น 170" 
                            class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-700 text-lg focus:outline-none focus:border-brand-500 focus:bg-white transition-colors placeholder-slate-300">
                        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-medium">cm</span>
                    </div>
                </div>

                <!-- Weight Input -->
                <div class="space-y-2">
                    <label for="weight" class="block text-sm font-medium text-slate-500 ml-1">น้ำหนัก (กิโลกรัม)</label>
                    <div class="relative">
                        <input type="number" id="weight" placeholder="เช่น 65" 
                            class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-700 text-lg focus:outline-none focus:border-brand-500 focus:bg-white transition-colors placeholder-slate-300">
                        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-medium">kg</span>
                    </div>
                </div>

                <!-- Error Message Container (Hidden by default) -->
                <div id="error-msg" class="hidden text-red-500 text-sm text-center bg-red-50 py-2 px-4 rounded-xl">
                    กรุณากรอกข้อมูลส่วนสูงและน้ำหนักให้ถูกต้อง
                </div>

                <!-- Calculate Button -->
                <button onclick="calculateBMI()" 
                    class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold text-lg py-4 rounded-2xl shadow-lg shadow-brand-500/30 transform hover:-translate-y-0.5 transition-all active:translate-y-0">
                    คำนวณ BMI
                </button>
            </div>

            <!-- Result Section (Hidden by default) -->
            <div id="result-section" class="hidden mt-8 pt-8 border-t border-slate-100 text-center animate-fade-in">
                <h3 id="result-name" class="text-xl font-bold text-slate-700 mb-1">คุณ...</h3>
                <p class="text-sm text-slate-500 mb-4">ค่า BMI ของคุณคือ</p>
                
                <div class="flex items-baseline justify-center gap-1 mb-3">
                    <span id="bmi-value" class="text-5xl font-bold tracking-tighter">0.0</span>
                </div>
                
                <div id="category-badge" class="inline-block px-4 py-2 rounded-full text-sm font-semibold transition-colors">
                    หมวดหมู่
                </div>
                
                <p id="advice-text" class="text-slate-500 text-sm mt-4 leading-relaxed">
                    คำแนะนำ
                </p>

                <div class="mt-5 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <p class="text-sm text-slate-500">น้ำหนักที่เหมาะสมตามเพศและส่วนสูงของคุณคือ</p>
                    <p class="text-lg font-bold text-slate-700 mt-1"><span id="ibw-value">0</span> กก.</p>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        function calculateBMI() {
            // Get input values
            const nameInput = document.getElementById('name').value.trim();
            const genderInput = document.querySelector('input[name="gender"]:checked').value;
            const heightInput = document.getElementById('height').value;
            const weightInput = document.getElementById('weight').value;
            const errorMsg = document.getElementById('error-msg');
            const resultSection = document.getElementById('result-section');

            // Reset UI states
            errorMsg.classList.add('hidden');
            resultSection.classList.add('hidden');

            // Validation
            if (!heightInput || !weightInput || heightInput <= 0 || weightInput <= 0) {
                errorMsg.classList.remove('hidden');
                return;
            }

            // Calculations
            const heightInMeters = heightInput / 100;
            const bmi = weightInput / (heightInMeters * heightInMeters);
            const roundedBMI = bmi.toFixed(1);

            // Calculate Ideal Body Weight (Devine formula)
            const heightInInches = heightInput / 2.54;
            let ibw = 0;
            if (genderInput === 'male') {
                ibw = 50.0 + 2.3 * Math.max(0, heightInInches - 60);
            } else {
                ibw = 45.5 + 2.3 * Math.max(0, heightInInches - 60);
            }
            const roundedIBW = ibw.toFixed(1);

            // Determine category, color classes, and advice
            let category = '';
            let badgeClass = '';
            let valueColorClass = '';
            let advice = '';

            // Using Asian/Thai standard BMI criteria
            if (bmi < 18.5) {
                category = 'น้ำหนักน้อยเกินไป';
                badgeClass = 'bg-blue-100 text-blue-700';
                valueColorClass = 'text-blue-500';
                advice = 'คุณมีน้ำหนักต่ำกว่าเกณฑ์ ควรรับประทานอาหารที่มีประโยชน์และเพิ่มปริมาณแคลอรี่ต่อวัน';
            } else if (bmi >= 18.5 && bmi <= 22.9) {
                category = 'น้ำหนักปกติ';
                badgeClass = 'bg-emerald-100 text-emerald-700';
                valueColorClass = 'text-emerald-500';
                advice = 'เยี่ยมมาก! คุณมีน้ำหนักอยู่ในเกณฑ์สุขภาพดี ควรดูแลการกินและออกกำลังกายเพื่อรักษาระดับนี้ไว้';
            } else if (bmi >= 23 && bmi <= 24.9) {
                category = 'ท้วม';
                badgeClass = 'bg-yellow-100 text-yellow-700';
                valueColorClass = 'text-yellow-500';
                advice = 'คุณเริ่มมีน้ำหนักเกินเกณฑ์เล็กน้อย ควรเริ่มควบคุมอาหารและเพิ่มการออกกำลังกาย';
            } else if (bmi >= 25 && bmi <= 29.9) {
                category = 'อ้วน';
                badgeClass = 'bg-orange-100 text-orange-700';
                valueColorClass = 'text-orange-500';
                advice = 'คุณมีความเสี่ยงต่อโรคที่เกี่ยวข้องกับความอ้วน ควรปรึกษาแพทย์หรือปรับเปลี่ยนพฤติกรรมด่วน';
            } else {
                category = 'อ้วนมาก';
                badgeClass = 'bg-red-100 text-red-700';
                valueColorClass = 'text-red-500';
                advice = 'คุณอยู่ในเกณฑ์อ้วนระดับอันตราย ควรปรึกษาแพทย์เพื่อหาแนวทางลดน้ำหนักอย่างถูกวิธี';
            }

            // Update DOM
            const bmiValueEl = document.getElementById('bmi-value');
            const categoryBadgeEl = document.getElementById('category-badge');
            
            // Set values including name and ideal body weight
            document.getElementById('result-name').textContent = nameInput ? `คุณ ${nameInput}` : 'ผลการคำนวณของคุณ';
            bmiValueEl.textContent = roundedBMI;
            categoryBadgeEl.textContent = category;
            document.getElementById('advice-text').textContent = advice;
            document.getElementById('ibw-value').textContent = roundedIBW;

            // Reset and apply colors
            bmiValueEl.className = `text-5xl font-bold tracking-tighter ${valueColorClass}`;
            categoryBadgeEl.className = `inline-block px-4 py-2 rounded-full text-sm font-semibold transition-colors ${badgeClass}`;

            // Show result with slight delay for smooth visual feel
            setTimeout(() => {
                resultSection.classList.remove('hidden');
                // Simple inline animation for fade in
                resultSection.style.opacity = 0;
                let op = 0.1;  // initial opacity
                resultSection.style.display = 'block';
                const timer = setInterval(function () {
                    if (op >= 1){
                        clearInterval(timer);
                    }
                    resultSection.style.opacity = op;
                    resultSection.style.filter = 'alpha(opacity=' + op * 100 + ")";
                    op += op * 0.1;
                }, 10);
            }, 100);
        }
    </script>
</body>
</html>
